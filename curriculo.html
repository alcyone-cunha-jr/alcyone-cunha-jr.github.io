<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Currículo – Alcyone Cunha Junior</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #080f1a; }

  /* ══ NAVBAR ══ */
  nav {
    position: sticky;
    top: 0;
    z-index: 999;
    background: #080f1a;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 40px;
    border-bottom: 2px solid #b8943f;
    height: 50px;
  }

  nav a {
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-decoration: none;
    transition: opacity .2s;
  }
  nav a:hover { opacity: .65; }

  .nav-left  { color: #b8943f; }
  .nav-center {
    font-family: 'Playfair Display', serif;
    font-size: 15px;
    color: rgba(255,255,255,0.35);
    letter-spacing: 4px;
    user-select: none;
  }
  .nav-right { color: rgba(255,255,255,0.45); }

  /* ══ PDF VIEWER ══ */
  .pdf-wrapper {
    width: 100%;
    height: calc(100vh - 50px);
    background: #1a1a2e;
  }

  .pdf-wrapper iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  /* Fallback para browsers que não suportam iframe de PDF */
  .pdf-fallback {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 24px;
    font-family: 'Montserrat', sans-serif;
    color: rgba(255,255,255,0.55);
    text-align: center;
    padding: 40px;
  }
  .pdf-fallback p {
    font-size: 14px;
    letter-spacing: 1px;
    line-height: 1.8;
  }
  .pdf-fallback a {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #b8943f;
    text-decoration: none;
    border: 1px solid #b8943f;
    padding: 12px 28px;
    transition: background .2s, color .2s;
  }
  .pdf-fallback a:hover {
    background: #b8943f;
    color: #080f1a;
  }
</style>
</head>
<body>

<!-- ══ NAVBAR ══ -->
<nav>
  <a href="index.html" class="nav-left">← Apresentação</a>
  <span class="nav-center">ACJ</span>
  <a href="portfolio.html" class="nav-right">Portfólio →</a>
</nav>

<!-- ══ PDF VIEWER ══ -->
<div class="pdf-wrapper">
  <iframe
    src="curriculo.pdf"
    title="Currículo – Alcyone Cunha Junior"
    onerror="document.querySelector('.pdf-fallback').style.display='flex'; this.style.display='none';"
  ></iframe>
  <div class="pdf-fallback">
    <p>Seu navegador não exibiu o PDF automaticamente.<br>Use o botão abaixo para abrí-lo.</p>
    <a href="curriculo.pdf" target="_blank">Abrir Currículo PDF</a>
  </div>
</div>

</body>
</html>
